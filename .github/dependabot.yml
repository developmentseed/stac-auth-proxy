version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Weekly group PRs were mostly replaced by the next week's before anyone merged them.
      interval: "monthly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    allow:
      # Include transitive dependencies (e.g. certifi via httpx): the Docker image installs uv.lock as is.
      - dependency-type: "all"
    cooldown:
      default-days: 7
    # Above the default 5, so the version group still opens next to open security PRs.
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Without this, each security advisory opens its own PR.
      security:
        applies-to: security-updates
        patterns:
          - "*"
