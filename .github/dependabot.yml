version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # None of the nine weekly group PRs was merged; each was replaced by a newer one.
      interval: "monthly"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      # Include transitive dependencies (e.g. certifi via httpx): the Docker image installs uv.lock as is.
      - dependency-type: "all"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Without this, each vulnerable dependency gets its own security PR.
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The Dockerfile's COPY paths name python3.13, so a new Python minor needs a hand edit.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
