version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # None of the nine weekly group PRs was merged; each was replaced by a newer one.
      interval: "monthly"
    groups:
      # Group names are matched by .github/workflows/dependabot-automerge.yaml.
      actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      # Include transitive dependencies (e.g. certifi via httpx): the Docker image installs uv.lock as is.
      - dependency-type: "all"
    cooldown:
      default-days: 7
    groups:
      # Split so a breaking runtime bump (e.g. cql2 0.5 -> 0.6) doesn't block dev tooling updates.
      # `dev` is automerged once CI passes; `prod` waits for review unless it is patch-only.
      dev:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      prod:
        applies-to: version-updates
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # Without this, each vulnerable dependency gets its own security PR.
      security:
        applies-to: security-updates
        patterns:
          - "*"
