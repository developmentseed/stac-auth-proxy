name: Dependabot automerge

# Enables GitHub auto-merge on low-risk Dependabot PRs; the merge still waits for required checks.
# Requires "Allow auto-merge" in repo settings and required status checks on main.
on: pull_request

permissions: {}

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Dev tooling, GitHub Actions, and anything patch-only. Runtime minors and all majors need review.
      - if: >-
          steps.meta.outputs.dependency-group == 'dev' ||
          steps.meta.outputs.dependency-group == 'actions' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
